name: Keep Render Alive

on:
  schedule:
    # 每14分钟运行一次，防止Render休眠（休眠是15分钟后）
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: curl -s -o /dev/null -w "%{http_code}" https://react-todolist-rawv.onrender.com/api/notify || true
