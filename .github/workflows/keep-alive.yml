name: Keep Render Alive & Check Deadlines

on:
  schedule:
    # 每1分钟运行一次，检查待办事项并发送通知
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service (Keep Alive)
        run: curl -s -o /dev/null -w "%{http_code}" https://react-todolist-rawv.onrender.com/api/health || true

      - name: Check Deadlines & Send Notifications
        run: curl -s https://react-todolist-rawv.onrender.com/api/check-deadlines
